<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 90" width="100%" height="100%">
  <defs>
    <linearGradient id="ukKeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00AEEF" />
      <stop offset="100%" stop-color="#0072CE" />
    </linearGradient>
    <linearGradient id="ukNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#134074" />
    </linearGradient>
  </defs>
  
  <!-- Emblem: Stylized Key Shield / Loop -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield / Loop -->
    <path d="M35 4 C18 4 6 16 6 33 C6 47 15 58 28 61 L28 72 L35 72 L35 62 L42 62 L42 56 L35 56 L35 61 C48 58 58 46 58 33 C58 16 46 4 35 4 Z" fill="none" stroke="url(#ukKeyGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Inner stylized 'U' & 'K' key teeth -->
    <path d="M22 24 L22 36 C22 43 27 47 34 47 C41 47 46 43 46 36 L46 24" fill="none" stroke="#0B2545" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M34 22 L34 40" fill="none" stroke="url(#ukKeyGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="34" cy="18" r="3.5" fill="#00AEEF"/>
    
    <!-- Key notch accents -->
    <rect x="38" y="66" width="7" height="3" rx="1.5" fill="#0072CE"/>
  </g>

  <!-- Typography -->
  <g transform="translate(86, 48)">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="38" fill="#0E2E5C" letter-spacing="-0.5">
      Ultra<tspan fill="#008FD5">key</tspan>
    </text>
  </g>
  
  <!-- Subtitle Tagline -->
  <g transform="translate(88, 68)">
    <rect x="0" y="-12" width="280" height="15" rx="2" fill="#0B2545"/>
    <text x="140" y="-1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" text-anchor="middle" letter-spacing="2.2">
      IT SOLUTIONS PRIVATE LIMITED
    </text>
  </g>
</svg>
